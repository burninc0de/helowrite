name: Release

permissions:
  contents: write
  packages: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Older Ubuntu for broader glibc compat across distros.
          - os: ubuntu-22.04
            target: linux-x86_64
            asset: helowrite-linux-x86_64
          - os: ubuntu-22.04-arm
            target: linux-arm64
            asset: helowrite-linux-arm64
          # Intel Macs (macos-13) dropped: scarce runners, long queues.
          # Intel Mac users can install via pipx instead.
          - os: macos-14
            target: macos-arm64
            asset: helowrite-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyinstaller textual rich pyfiglet watchdog

      - name: Build binary
        run: pyinstaller helowrite.spec
        working-directory: ${{ github.workspace }}

      - name: Rename binary for target
        shell: bash
        run: |
          mv dist/helowrite "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"
          ls -lh dist/

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  create_release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Make binaries executable
        run: |
          chmod +x dist/helowrite-*
          ls -lh dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: dist/helowrite-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
